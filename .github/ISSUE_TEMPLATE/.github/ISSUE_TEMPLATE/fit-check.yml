name: Free public-issue eligibility check
description: Check scope only for one public, non-security GitHub issue. No analysis or purchase required.
title: "[FIT CHECK] "
body:
  - type: markdown
    attributes:
      value: |
        This public form answers only whether one issue fits the published evidence method. It provides no analysis, recommendation, quote, checkout, or promise of service.

        Do not submit secrets, credentials, personal or customer data, confidential material, unpublished code, logs, attachments, or vulnerability details. For a vulnerability, use the affected project's official security channel.
  - type: input
    id: public_issue_url
    attributes:
      label: Public GitHub issue URL
      description: One existing https://github.com/OWNER/REPO/issues/NUMBER URL only.
      placeholder: https://github.com/OWNER/REPO/issues/123
    validations:
      required: true
  - type: checkboxes
    id: public_scope_attestations
    attributes:
      label: Public-scope attestations
      options:
        - label: The issue and repository are public, and the issue reports a software bug.
          required: true
        - label: This is not a security vulnerability and contains no exploit or disclosure material.
          required: true
        - label: My submission contains only the URL above, with no private, personal, confidential, credential, customer, or unpublished information.
          required: true
        - label: I understand this public issue receives only ELIGIBLE or INELIGIBLE and no analysis, recommendation, purchase link, or follow-up.
          required: true
